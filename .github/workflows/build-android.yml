name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        working-directory: apps/mobile-web
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_SIGNALING_URL: ${{ secrets.SIGNALING_WS_URL }}
          CI: '1'

      - name: Make gradlew executable
        working-directory: apps/mobile-web/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: apps/mobile-web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Determine version label
        id: ver
        run: |
          if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "" ]]; then
            echo "label=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          else
            echo "label=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp apps/mobile-web/android/app/build/outputs/apk/debug/app-debug.apk \
             dist/ClearRelay-${{ steps.ver.outputs.label }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearRelay-APK
          path: dist/ClearRelay-*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClearRelay-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
