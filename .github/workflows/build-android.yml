name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        working-directory: apps/mobile-web
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SIGNALING_URL: ${{ secrets.SIGNALING_WS_URL }}

      - name: Make gradlew executable
        working-directory: apps/mobile-web/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: apps/mobile-web/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp apps/mobile-web/android/app/build/outputs/apk/release/app-release.apk \
             dist/ClearRelay-${{ github.ref_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearRelay-APK
          path: dist/ClearRelay-*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClearRelay-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
