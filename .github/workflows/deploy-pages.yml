name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Require access key secret
        env:
          ACCESS_KEYS: ${{ secrets.EXPO_PUBLIC_ACCESS_KEYS }}
        run: |
          if [ -z "$ACCESS_KEYS" ]; then
            echo "::error::Add the EXPO_PUBLIC_ACCESS_KEYS repository secret before deploying."
            exit 1
          fi

      - name: Export web
        env:
          EXPO_BASE_URL: /omni-relay
          EXPO_PUBLIC_ACCESS_KEYS: ${{ secrets.EXPO_PUBLIC_ACCESS_KEYS }}
        run: npm run export:web

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
